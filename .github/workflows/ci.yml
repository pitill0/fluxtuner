name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Ruff, compile and tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Run Bandit
        run: |
          bandit -r fluxtuner -c pyproject.toml

      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check .

      - name: Ruff check formatting
        run: |
          ruff format --check .

      - name: Run mypy
        run: |
          mypy --follow-imports=skip fluxtuner/

      - name: Compile Python files
        run: |
          python -m compileall fluxtuner tests

      - name: Run tests
        run: |
          python -m pytest

  brynse-contracts:
    name: Real Brynse contracts / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install FluxTuner and pinned Brynse
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-brynse.txt
          python -m pip install "pytest-json-report>=1.5,<2"

      - name: Verify Brynse revision and prerequisites
        run: |
          python - <<'PYVERIFY'
          import importlib
          import json
          import shutil
          from importlib.metadata import distribution
          from pathlib import Path

          requirement = next(
              line.strip()
              for line in Path("requirements-brynse.txt").read_text().splitlines()
              if line.strip() and not line.startswith("#")
          )
          expected = requirement.rsplit("@", 1)[1]
          actual = json.loads(
              distribution("brynse").read_text("direct_url.json")
          )["vcs_info"]["commit_id"]

          assert actual == expected, (actual, expected)
          assert shutil.which("ffmpeg"), "FFmpeg missing"
          importlib.import_module("brynse.integrations.radio")
          print("Pinned Brynse and FFmpeg verified:", actual)
          PYVERIFY

      - name: Run mandatory real Brynse contracts
        run: |
          python -m pytest -q --strict-markers \
            --json-report \
            --json-report-file=brynse-contracts.json \
            tests/test_brynse_ripper_contract.py

      - name: Reject skipped or missing contracts
        run: |
          python - <<'PYVERIFY'
          import json
          from pathlib import Path

          report = json.loads(Path("brynse-contracts.json").read_text())
          summary = report["summary"]

          collected = summary.get("collected", 0)
          passed = summary.get("passed", 0)

          assert collected >= 7, summary
          assert summary.get("total") == collected, summary
          assert passed == collected, summary
          assert summary.get("skipped", 0) == 0, summary
          assert summary.get("failed", 0) == 0, summary
          assert summary.get("error", 0) == 0, summary

          print(f"All {passed} real Brynse contracts passed without skips.")
          PYVERIFY

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project and audit tooling
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -e ".[dev]"

      - name: Run pip-audit
        run: |
          pip-audit --local

  package:
    name: Build Python package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: |
          python -m build

      - name: Check built artifacts
        run: |
          test -n "$(ls dist/*.tar.gz)"
          test -n "$(ls dist/*.whl)"

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import fluxtuner.gui.tray
          from fluxtuner.gui.tray.linux_sni import LinuxStatusNotifierItem

          assert LinuxStatusNotifierItem is not None
          print("GTK tray package import OK")
          PY
          fluxtuner --version
          fluxtuner --help
          fluxtuner --list-players
          fluxtuner --list-themes
